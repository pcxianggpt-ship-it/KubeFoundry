server:
  port: "10001"

kubefoundry:
  app-dir: ${KF_APP_DIR:${user.dir}}
  data-dir: ${KF_DATA_DIR:data}
  jobs:
    workers: ${KF_JOB_WORKERS:5}
    queue-capacity: ${KF_JOB_QUEUE_CAPACITY:100}
    heartbeat-ms: ${KF_SSE_HEARTBEAT_MS:15000}

spring:
  web:
    resources:
      static-locations: file:${KF_WEB_DIR:web}/,classpath:/static/
  datasource:
    url: jdbc:h2:file:${KF_DATA_DIR:data}/kubefoundry;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  file:
    name: ${KF_LOG_DIR:logs}/kubefoundry.log
