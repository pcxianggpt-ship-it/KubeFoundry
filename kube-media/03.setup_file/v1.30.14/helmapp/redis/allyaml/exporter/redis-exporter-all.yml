#k8s服务暴露
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-exporter
  name: redis-exporter
  namespace: kubemate-monitoring-system
spec:
  ports:
    - port: 9121
      protocol: TCP
      targetPort: 9121
      name: redis-exporter
  selector:
    app: redis-exporter
  sessionAffinity: None
  type: ClusterIP
---
#k8s部署
kind: Deployment
apiVersion: apps/v1
metadata:
  name: redis-exporter
  namespace: kubemate-monitoring-system
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: 38.62.44.40:5000/prom/redis_exporter:7.0.5-alpine3.16
          ports:
            - name: exporter-port
              containerPort: 9121
              protocol: TCP
          env:
            - name: REDIS_ADDR
              value: 'redis://als9-redis:6379'
            - name: REDIS_PASSWORD
              value: 'amarsoft'
          resources: { }
      restartPolicy: Always