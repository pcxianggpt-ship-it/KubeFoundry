global:
  imageRegistry: registry:5000
  defaultStorageClass: localpath
  security:
    # 私有仓库改写会触发 Bitnami 的仓库名检查；运行镜像使用私有仓库中的固定版本标签。
    allowInsecureImages: true

# 固定新安装的 StatefulSet/Pod 名称为 redis-node、redis-node-0/1/2。
fullnameOverride: redis

commonLabels:
  app.kubernetes.io/managed-by: kubefoundry
  kubefoundry.io/component-group: redis_sentinel

architecture: replication

auth:
  enabled: true
  sentinel: true
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password
  usePasswordFiles: true
  usePasswordFileFromSecret: true

image:
  registry: registry-1.docker.io
  repository: bitnami/redis
  tag: "8.10.1"
  digest: ""
  pullPolicy: IfNotPresent

master:
  count: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: localpath
    size: 8Gi

replica:
  kind: StatefulSet
  # Sentinel 模式使用同一 StatefulSet，3 个 Pod 中动态选举 1 主 2 从。
  replicaCount: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: localpath
    size: 8Gi

sentinel:
  enabled: true
  image:
    registry: registry-1.docker.io
    repository: bitnami/redis-sentinel
    tag: "8.10.1"
    digest: ""
    pullPolicy: IfNotPresent
  masterSet: redis-master
  quorum: 2
  persistence:
    enabled: false

networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true

metrics:
  enabled: false
  image:
    registry: registry-1.docker.io
    repository: bitnami/redis-exporter
    tag: latest
    digest: sha256:09233726b19097ccbeb7a90347a7a0975c015de9efafaf2ac90d62dae241ca67

volumePermissions:
  enabled: false
  image:
    registry: registry-1.docker.io
    repository: bitnami/os-shell
    tag: latest
    digest: sha256:52f04d8e29dc3d77929fca8d75890c4cabe6182f650e0e921057a744559a9736

sysctl:
  enabled: false
  image:
    registry: registry-1.docker.io
    repository: bitnami/os-shell
    tag: latest
    digest: sha256:52f04d8e29dc3d77929fca8d75890c4cabe6182f650e0e921057a744559a9736
