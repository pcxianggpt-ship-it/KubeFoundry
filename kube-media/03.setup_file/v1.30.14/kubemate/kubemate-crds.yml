---
#------start install kubemate------
#kubemate账号管理的自定义资源文件类型
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.a3cloudkm.amarsoft.com
spec:
  group: a3cloudkm.amarsoft.com
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              label:
                type: string
              password: 
                type: string
              token:
                type: string
              status:
                type: string
              roles:
                type: array
                items:
                  type: string
              namespaces:
                type: array
                items:
                  type: string                  
  names:
    kind: KMUser
    plural: users
  scope: Cluster
#kubemate系统账号
---
#kubemate账号角色的自定义资源文件类型
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: roles.a3cloudkm.amarsoft.com
spec:
  group: a3cloudkm.amarsoft.com
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              label:
                type: string
              nodelete:
                type: boolean
              status: 
                type: string
              namespace: 
                type: string
              rights:
                type: array
                items:
                  type: object
                  properties:
                    group:
                      type: string
                    labels:
                      type: array
                      items:
                        type: string
  names:
    kind: KMRole
    plural: roles
  scope: Cluster
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: middles.kubemate.amarsoft.com
spec:
  group: kubemate.amarsoft.com
  scope: Cluster
  names:
    plural: middles
    singular: middle
    kind: MiddleKind
    shortNames:
      - mk
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sortid:
                  type: integer
                name:
                  type: string
                label:
                  type: string
                icon:
                  type: string
                address:
                  type: string
                disable:
                  type: boolean
                roles:
                  type: string
                openType:
                  type: string
---
kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: configmapversions.kubemate.amarsoft.com
spec:
  group: kubemate.amarsoft.com
  names:
    plural: configmapversions
    singular: configmapversion
    kind: ConfigMapVersion
    listKind: ConfigMapVersionList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              spec:
                type: object
                properties:
                  value:
                    type: string
  conversion:
    strategy: None
---
kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: secretversions.kubemate.amarsoft.com
spec:
  group: kubemate.amarsoft.com
  names:
