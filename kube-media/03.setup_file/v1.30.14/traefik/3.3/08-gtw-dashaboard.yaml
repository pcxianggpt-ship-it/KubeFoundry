---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashabord
  namespace: kubemate-system
spec:
  parentRefs:
  - name: prod-web 
  hostnames:
  - "traefik.kubemate-system"
  rules: 
    - backendRefs:
        - name: 'api@internal'
          group: 'traefikservices.traefik.io'
          kind: TraefikService
          weight: 1
          #port: 80
      matches:
      - path:
          type: PathPrefix
          value: /dashboard
      - path:
          type: PathPrefix
          value: /api          
