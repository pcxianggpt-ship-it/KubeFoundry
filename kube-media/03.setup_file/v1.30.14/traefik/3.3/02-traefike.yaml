apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik
  namespace: kubemate-system
  labels:
    app: traefik
spec:
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
      annotations:
        logging.kubesphere.io/logsidecar-config: '{}'
        prometheus.io/path: /metrics
        prometheus.io/port: '9100'
        prometheus.io/scrape: 'true'
    spec:
      tolerations:
      # this toleration is to have the daemonset runnable on master nodes
      # remove it if your masters can't run pods
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      volumes:
        - hostPath:
            type: ''
            path: /etc/localtime
          name: host-time
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
      containers:
        - name: traefik
          env:
          - name: TZ
            value: Asia/Shanghai
          image: registry:5000/traefik:v3.3
          args:
            - '--entrypoints.web.forwardedHeaders.insecure'
            - '--entrypoints.websecure.forwardedHeaders.insecure'
            - '--entrypoints.web.proxyProtocol.insecure'
            - '--global.checknewversion=false'
            - '--global.sendanonymoususage'
            - '--entrypoints.metrics.address=:9100'
            - '--entrypoints.traefik.address=:9000/tcp'
            - '--entrypoints.web.address=:8000/tcp'
            - '--entrypoints.websecure.address=:8443/tcp'
            - '--api.dashboard=true'
            - '--api.insecure=true'
            #- '--experimental.kubernetesgateway=true'
            #- '--providers.kubernetesgateway.experimentalchannel=true'
            - '--providers.kubernetesgateway=true'
            - '--ping=true'
            - '--api=true'
            - '--metrics.prometheus=true'
            - '--metrics.prometheus.entrypoint=metrics'
            - '--providers.kubernetescrd=true'
            - '--providers.kubernetesingress=true'
            - '--metrics.prometheus.addEntryPointsLabels=true'
           #- '--log.filePath=/tmp/traefik.log'
            - '--accesslog.filePath=/tmp/access.log'
            - '--log.level=info'
            - '--accesslog=true'
            - '--tracing.otlp=true'
            - '--tracing.otlp.http=true'
            - '--tracing.addinternals'
            - '--tracing.otlp.http.endpoint=http://opentelemetry-collector:4318/v1/traces'
            - '--metrics.otlp=true'
            - '--metrics.otlp.addEntryPointsLabels=true'
            - '--metrics.otlp.addRoutersLabels=true'
            - '--metrics.otlp.addServicesLabels=true'
            - '--metrics.otlp.explicitBoundaries=0.1,0.3,1.2,5.0'
            - '--metrics.otlp.http=true'
            - '--metrics.otlp.http.endpoint=http://opentelemetry-collector:4318/v1/metrics'
            #- '--accesslog.addinternals'
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
            - name: traefik
              containerPort: 9000
              protocol: TCP
            - name: web
              containerPort: 8000
              protocol: TCP
            - name: websecure
              containerPort: 8443
              protocol: TCP
            - name: dashboard
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 100Mi              
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - mountPath: /etc/localtime
              name: host-time
          livenessProbe:
            httpGet:
              path: /ping
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              drop:
                - ALL
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      serviceAccountName: traefik-account
      serviceAccount: traefik-account
      securityContext:
        fsGroup: 65532
      schedulerName: default-scheduler              
---
kind: Service
apiVersion: v1
metadata:
  name: traefik
  namespace: kubemate-system
  labels:
    app: traefik
spec:
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: web
      nodePort: 30477
    - name: metrics
      protocol: TCP
      port: 9100
      targetPort: metrics
      nodePort: 30491
    - name: websecure
      protocol: TCP
      port: 443
      targetPort: websecure
      nodePort: 31684
    - name: traefik-dashboard
      port: 9000
      targetPort: 9000
      nodePort: 30080
  selector:
    app: traefik
  type: NodePort
  sessionAffinity: None
  externalTrafficPolicy: Local
