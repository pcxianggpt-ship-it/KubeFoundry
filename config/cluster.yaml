# KubeFoundry K8S 集群配置文件
# 版本：1.0.0
# 说明：根据实际环境修改以下配置
#
# 配置文件说明：
# 1. 所有路径都是相对于管理节点的路径
# 2. IP 地址和主机名需要根据实际环境修改
# 3. IPv6 地址为可选，如不需要可以注释掉
# 4. 路径配置需要根据实际安装包位置修改

#===============================================================================
# 集群基本信息
#===============================================================================
cluster:
  # 集群名称
  name: "k8s-cluster"

  # K8S 版本
  k8s_version: "1.30.14"

  # Pod 网络网段（Flannel 默认使用 10.244.0.0/16）
  pod_subnet: "10.244.0.0/16"

  # Service 网络网段
  service_subnet: "10.96.0.0/16"

#===============================================================================
# 控制节点配置
# 说明：至少需要 1 个控制节点，3 个控制节点支持高可用
#===============================================================================
control_plane:
  # 控制节点 1（主控制节点，执行 yum 源配置和集群初始化）
  - hostname: "k8sc1"
    ip: "192.168.123.130"
    ipv6: "fd00:42::130"

  # # 控制节点 2（从控制节点）
  # - hostname: "k8sc2"
  #   ip: "192.168.123.19"
  #   ipv6: "fd00:42::19"

  # # 控制节点 3（从控制节点，同时作为镜像仓库节点）
  # - hostname: "k8sc3"
  #   ip: "192.168.123.20"
  #   ipv6: "fd00:42::20"

#===============================================================================
# 工作节点配置
# 说明：至少需要 1 个工作节点
#===============================================================================
workers:
  - hostname: "k8sw1"
    ip: "192.168.123.131"
    ipv6: "fd00:42::131"

  - hostname: "k8sw2"
    ip: "192.168.123.132"
    ipv6: "fd00:42::132"

  # - hostname: "k8sw3"
  #   ip: "192.168.123.23"
  #   ipv6: "fd00:42::23"

  # - hostname: "k8sw4"
  #   ip: "192.168.123.24"
  #   ipv6: "fd00:42::24"

  # - hostname: "k8sw5"
  #   ip: "192.168.123.25"
  #   ipv6: "fd00:42::25"

  # - hostname: "k8sw6"
  #   ip: "192.168.123.26"
  #   ipv6: "fd00:42::26"

#===============================================================================
# 镜像仓库配置
# 说明：镜像仓库节点可以与控制节点同机（如 k8sc3）
#===============================================================================
registry:
  # 镜像仓库主机名
  hostname: "registry"

  # 镜像仓库 IP 地址
  ip: "192.168.123.130"

  # 镜像仓库 IPv6 地址（可选）
  # ipv6: "fd00:42::20"

  # 镜像仓库端口
  port: 5000

#===============================================================================
# 网络配置
#===============================================================================
network:
  # IPv4 网关
  gateway: "192.168.123.1"

  # IPv6 网关（可选）
  ipv6_gateway: "fd00::1"

  # API Server 端口（默认 6443）
  api_server_port: 6443

#===============================================================================
# SSH 配置
# 说明：管理节点需要配置 SSH 免密登录到所有节点
#===============================================================================
ssh:
  # SSH 用户名（默认 root）
  user: "root"

  # SSH 端口（默认 22）
  port: 22

  # SSH 密码（用于自动配置免密登录）
  password: "Kylin123123"

  # SSH 密钥路径（默认 ~/.ssh/id_rsa）
  key_path: "~/.ssh/id_rsa"

  # SSH 连接超时时间（秒）
  timeout: 30

  # SSH 连接复用保持时间（秒）
  # 说明：用于加速同一节点连续执行短命令，0 表示命令结束后立即关闭复用连接
  control_persist: 300

#===============================================================================
# 路径配置
# 说明：根据实际环境修改路径，确保文件存在
#===============================================================================
paths:
  # K8S 安装根目录（所有节点都需要此目录）
  # 此目录应包含以下子目录：
  # - 01.rpm_package/     # RPM 包
  # - 02.container_runtime/ # Containerd 安装包
  # - 03.setup_file/      # 配置文件和模板
  # - 04.registry/        # 镜像仓库安装脚本
  # - 05.crontab/         # 定时任务脚本
  k8s_home: "/data/k8s_install"  # K8S安装目录，可根据实际环境修改

  # 安装介质包根目录（管理节点本地存放安装介质的路径）
  # 说明：包含各操作系统和架构的安装介质包
  # 目录结构示例：
  #   ${install_media}/
  #   ├── k8srepo_kylinos_sp3_amd64.tar.gz
  #   ├── k8srepo_kylinos_sp3_arm64.tar.gz
  #   ├── k8srepo_centos7_amd64.tar.gz
  #   └── ...
  install_media: "/root/kube-media"  # 安装介质包根目录，可按需修改

  # 系统架构（自动检测或手动指定）
  # 可选值：amd64, arm64
  arch: "amd64"

  # YUM 源文件路径（3.1 配置本地yum源使用）
  # 说明：支持 ${install_media} 和 ${arch} 变量占位符，运行时自动展开
  # 示例：${install_media}/01.rpm_package/k8srepo_kylinos_sp3_${arch}.tar.gz
  repo_source: "${install_media}/01.rpm_package/k8srepo_kylinos_sp3_${arch}.tar.gz"

  # 100 年证书版本 kubeadm 文件路径（3.5 替换kubeadm使用）
  # 说明：这是修改过证书有效期的 kubeadm 二进制文件
  # 示例：/data/k8s_install/01.rpm_package/kubeadm-1.29.0-100y-amd64
  kubeadm_100y: "${install_media}/01.rpm_package/kubeadm-1.30.14-100y-amd64"

  # Containerd 安装包路径（3.7 安装containerd使用）
  # 说明：此目录应包含以下文件：
  # - containerd-1.7.18-linux-amd64.tar.gz
  # - runc.amd64
  # - cni-plugins-linux-amd64-v1.8.0.tgz
  # - buildkit-v0.25.2.linux-amd64.tar.gz
  # - nerdctl-2.2.0-linux-amd64.tar.gz
  # - config-1.7.18.toml
  # - containerd.service
  # - buildkit.service
  container_runtime: "${install_media}/02.container_runtime"

  # 镜像仓库安装脚本路径（3.8 安装镜像仓库使用）
  # 说明：镜像仓库安装脚本路径
  # 示例：/data/k8s_install/04.registry
  registry_install: "${install_media}/04.registry"

#===============================================================================
# 存储配置（NFS）
#===============================================================================
storage:
  # NFS 服务器IP地址
  nfs_server: "192.168.123.130"

  # NFS 共享路径
  nfs_path: "/data/nfs_root"

  # NFS 本地挂载点
  nfs_mount_point: "/data/nfs_root"

  # StorageClass 名称
  storage_class: "nfs-storage"

#===============================================================================
# 高级配置（可选）
#===============================================================================
advanced:
  # 是否启用 IPv6 双栈网络
  # 说明：启用后集群将同时支持 IPv4 和 IPv6
  enable_ipv6_dual_stack: false

  # 是否启用自动回滚
  # 说明：安装失败时自动执行回滚操作
  auto_rollback: true

  # 安装超时时间（秒）
  # 说明：单个步骤的最长执行时间，超时后将终止
  install_timeout: 3600

  # 是否跳过验证步骤
  # 说明：跳过每个步骤后的验证操作（不推荐）
  skip_verify: false

  # 是否启用详细日志
  # 说明：输出更详细的执行日志
  verbose_logging: true

  # 是否保留备份文件
  # 说明：安装过程中备份的文件将被保留（用于调试）
  keep_backup: true

#===============================================================================
# 生态系统组件配置
# 说明：控制 Phase3 各组件是否安装，设为 false 可跳过对应组件
# 注意：组件间存在依赖关系，禁用被依赖组件时依赖组件将自动跳过
#===============================================================================
ecosystem:
  # Kubemate 管理界面
  kubemate_ui: true

  # NFS 存储
  nfs: true

  # Elasticsearch + Skywalking APM（一组，同时安装或同时跳过）
  elasticsearch: false

  # Loki 日志聚合
  loki: false

  # OpenEBS 存储系统
  openebs: false

  # Grafana Alloy 可观测性代理
  alloy: false

  # MinIO 对象存储
  minio: false

  # Traefik Ingress 网关 + Traefik Mesh 服务网格（一组，同时安装或同时跳过）
  traefik: true

  # Prometheus 监控套件
  prometheus: true

  # CoreDNS 反亲和性更新（依赖 Traefik）
  coredns_update: true

  # Metrics Server（启用 kubectl top）
  metrics_server: false

  # kubectl 普通用户权限配置
  kubectl_permission: true

  # F5 负载均衡高可用
  f5_ha: false

  # Redis 哨兵模式（默认关闭，可选组件）
  redis_sentinel: false

  # ETCD 备份定时任务
  etcd_backup: true

  # Traefik 清理定时任务（依赖 Traefik 组）
  traefik_cleanup: false

  # 日志清理定时任务
  log_cleanup: false

#===============================================================================
# 环境变量配置（可选）
#===============================================================================
env:
  # Kubelet 数据目录
  kubelet_root: "${k8s_home}/kubelet_root"

  # Containerd 数据目录
  containerd_root: "${k8s_home}/containerd-data"

  # ETCD 数据目录
  etcd_data_dir: "${k8s_home}/etcd_backup"

#===============================================================================
# 注意事项
#===============================================================================
# 1. 确保所有节点时间同步（建议使用 NTP）
# 2. 确保管理节点可以 SSH 免密登录到所有节点
# 3. 确保所有路径配置正确，文件存在
# 4. 确保 IP 地址和主机名配置准确无误
# 5. 确保防火墙和 SELinux 配置正确
# 6. 建议先在测试环境验证配置
# 7. 安装前请备份重要数据
