name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: web/backend-java/pom.xml
      - run: mvn --batch-mode test
        working-directory: web/backend-java

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
        working-directory: web/frontend
      - run: npm test
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
      - run: npm audit --omit=dev
        working-directory: web/frontend

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: bash scripts/tests/run_all.sh
      - run: bash scripts/ci/check-lf.sh
      - run: bash scripts/ci/check-secrets.sh
